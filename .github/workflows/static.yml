name: Static site checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Cache pip downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-
      - name: Cache Playwright Chromium binaries
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-
      - name: Validate data and art manifests
        run: |
          node scripts/validate-data.mjs
          node scripts/gen-prompts.mjs --check
          node scripts/gen-manifest.mjs --check
          node scripts/check-art.mjs
          # firestore-rules.test.mjs needs npm-installed Firebase SDK packages
          # and the emulator; it has its own dedicated job (firestore-rules)
          # below. This job never runs `npm ci`, so importing it here fails
          # at module-load time before a single subtest can run.
          node --test $(ls test/*.test.mjs | grep -v firestore-rules.test.mjs)
      - name: Install browser smoke dependency
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Run browser smoke test
        run: python scripts/smoke.py --engine chromium

  browser-smoke-webkit:
    name: Browser smoke (WebKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Cache pip downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-
      - name: Cache Playwright WebKit binaries
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: |
            playwright-webkit-${{ runner.os }}-
      - name: Install browser smoke dependency
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps webkit
      - name: Run browser smoke test
        run: python scripts/smoke.py --engine webkit

  firestore-rules:
    name: Firestore rules (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated rules-test dependencies
        run: npm ci
      - name: Run rules against the demo emulator project
        run: npx firebase emulators:exec --only firestore "npm run test:rules"
