name: Static site checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate data and art manifests
        run: |
          node scripts/validate-data.mjs
          node scripts/gen-prompts.mjs --check
          node scripts/gen-manifest.mjs --check
          node scripts/check-art.mjs
          node --test test/*.test.mjs
      - name: Install browser smoke dependency
        run: |
          python -m pip install playwright
          playwright install --with-deps chromium
      - name: Run browser smoke test
        run: python scripts/smoke.py
